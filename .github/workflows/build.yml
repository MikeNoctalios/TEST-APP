name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/by/mathtest app/src/main/res/xml
          cat > settings.gradle.kts <<'EOF_X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MathTest"
          include(":app")
          EOF_X
          cat > build.gradle.kts <<'EOF_X'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_X
          cat > gradle.properties <<'EOF_X'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_X
          cat > app/build.gradle.kts <<'EOF_X'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "by.mathtest"
              compileSdk = 34
              defaultConfig { applicationId = "by.mathtest"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.core:core-ktx:1.13.1") }
          EOF_X
          cat > app/src/main/AndroidManifest.xml <<'EOF_X'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Тест по математике" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:windowSoftInputMode="adjustResize" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider android:name="androidx.core.content.FileProvider" android:authorities="by.mathtest.fp"
                      android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/paths"/>
                  </provider>
              </application>
          </manifest>
          EOF_X
          cat > app/src/main/res/xml/paths.xml <<'EOF_X'
          <paths><cache-path name="c" path="."/></paths>
          EOF_X
          cat > app/src/main/java/by/mathtest/MainActivity.kt <<'EOF_X'
          package by.mathtest

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.widget.Toast
          import android.os.Bundle
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import androidx.core.content.FileProvider
          import java.io.File

          class MainActivity : Activity() {
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // Запрет скриншотов, записи экрана, Circle to search и превью в «недавних»
                  window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                  val web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.addJavascriptInterface(object {
                      @JavascriptInterface
                      fun save(name: String, text: String): Boolean {
                          if (Build.VERSION.SDK_INT < 29) return false
                          return try {
                              val safe = name.replace(Regex("[^\\p{L}\\p{N}_.-]"), "_")
                              val v = ContentValues().apply {
                                  put(MediaStore.Downloads.DISPLAY_NAME, safe)
                                  put(MediaStore.Downloads.MIME_TYPE, "text/plain")
                                  put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                              }
                              val u = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v)!!
                              contentResolver.openOutputStream(u)!!.use { it.write(text.toByteArray()) }
                              runOnUiThread { Toast.makeText(this@MainActivity, "Сохранено в «Загрузки»: $safe", Toast.LENGTH_LONG).show() }
                              true
                          } catch (e: Exception) { false }
                      }

                      @JavascriptInterface
                      fun share(name: String, text: String) {
                          val safe = name.replace(Regex("[^\\p{L}\\p{N}_.-]"), "_")
                          val f = File(cacheDir, safe)
                          f.writeText(text)
                          val uri = FileProvider.getUriForFile(this@MainActivity, "by.mathtest.fp", f)
                          val i = Intent(Intent.ACTION_SEND).setType("text/plain")
                              .putExtra(Intent.EXTRA_STREAM, uri)
                              .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          startActivity(Intent.createChooser(i, "Отправить результат"))
                      }
                  }, "Android")
                  setContentView(web)
                  web.requestFocus()
                  web.loadUrl("file:///android_asset/index.html")
              }

              // Случайное «Назад» не должно закрывать тест
              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {}
          }
          EOF_X
          cp index.html app/src/main/assets/index.html
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MathTest-apk, path: app/build/outputs/apk/debug/app-debug.apk }
